databases:
  - name: andropedia-db
    databaseName: andropedia
    user: andropedia
    plan: free

services:
  - type: web
    name: andropedia-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: andropedia-db
          property: connectionString
      - key: NODE_VERSION
        value: "24"
      # Set to the deployed frontend origin once Vercel gives you a URL.
      - key: CORS_ORIGIN
        sync: false
      # Coordinator login (Phase 2 auth) — set these in the Render dashboard.
      - key: COORDINATOR_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NODE_ENV
        value: production
